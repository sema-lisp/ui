name: Publish to npm

# Publishes @sema-lang/ui to npm via Trusted Publishing (OIDC) — no token.
#
# npm whitelists this workflow's *filename* + repo for the package's trusted
# publisher, so keep publishing in `publish-npm.yml`. Configure the trusted
# publisher once on npmjs.org: package @sema-lang/ui -> repo sema-lisp/ui ->
# workflow `publish-npm.yml`. Requires npm >= 11.5.1 (Node 24 bundles it).
#
# Trigger by pushing a `v*` tag (version taken from the tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual re-publish (version read from package.json)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
